<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>API Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1, h2 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px 0; }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
        .section { margin-bottom: 30px; }
    </style>
</head>
<body>
    <h1>API Dashboard</h1>

    <div class="section">
        <h2>المرضى (Patients)</h2>
        <ul>
            <li><a href="/api/patients/" target="_blank">عرض كل المرضى</a></li>
        </ul>
    </div>

    <div class="section">
        <h2>الزيارات (Visits)</h2>
        <ul>
            <li><a href="/api/visits/" target="_blank">عرض كل الزيارات</a></li>
        </ul>
    </div>

    <div class="section">
        <h2>العيادات الرئسية (Clinics)</h2>
        <ul>
            <li><a href="/api/clinics/" target="_blank">عرض كل العيادات</a></li>
        </ul>
    </div>


    <div class="section">
        <h2>الدكاترة (Doctors)</h2>
        <ul>
            <li><a href="/api/doctors/" target="_blank">عرض كل الدكاترة</a></li>
        </ul>
    </div>

    <div class="section">
        <h2>لوحة التحكم (Dashboard)</h2>
        <ul>
            <li><a href="/api/dashboard/" target="_blank">عرض إحصائيات المرضى والزيارات والدكاترة</a></li>
        </ul>
    </div>
</body>
</html>
