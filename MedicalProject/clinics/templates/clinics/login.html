<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #f0f4f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .login-card .icon-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }
        .login-card h3 {
            font-weight: 700;
            color: #1e293b;
            text-align: center;
        }
        .login-card p.sub {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 14px;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: #fff;
        }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-weight: 700;
            color: #fff;
            width: 100%;
            transition: 0.3s;
            font-size: 1.05rem;
        }
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
            color: #fff;
        }
        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 25px 0;
        }
        .link-custom {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }
        .link-custom:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-box"><i class="fas fa-hospital"></i></div>
    <h3>مرحبًا بعودتك</h3>
    <p class="sub">سجل الدخول للوصول إلى لوحة التحكم</p>

    {% if form.non_field_errors %}
        <div class="alert alert-danger text-center fw-semibold"><i class="fas fa-exclamation-circle me-2"></i>{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>اسم المستخدم</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>كلمة المرور</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>دخول</button>
    </form>

    <hr class="divider">
    <div class="text-center">
        <p class="mb-2">ليس لديك حساب؟</p>
        <a href="{% url 'register' %}" class="btn btn-outline-success rounded-pill px-4 fw-semibold">
            <i class="fas fa-user-plus me-2"></i>إنشاء حساب جديد
        </a>
    </div>
</div>

</body>
</html>
