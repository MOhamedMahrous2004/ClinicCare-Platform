{% extends "clinics/base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card card-modern p-4 mx-auto" style="max-width:800px;">
        <h4 class="fw-bold text-success"><i class="fas fa-plus-circle me-2"></i> حجز جديد</h4>

        <form method="POST" class="mt-3">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-user-injured me-2"></i>المريض</label>
                    <select name="patient" class="form-select">
                        <option value="">اختر</option>
                        {% for p in patients %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-clinic-medical me-2"></i>العيادة الرئيسية</label>
                    <select name="main_clinic" class="form-select">
                        <option value="">اختر</option>
                        {% for m in main_clinics %}
                            <option value="{{ m.id }}">{{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-clinic-medical me-2"></i>العيادة الفرعية</label>
                    <select name="sub_clinic" class="form-select">
                        <option value="">اختر</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-user-md me-2"></i>الطبيب</label>
                    <select name="doctor" class="form-select">
                        <option value="">اختر</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-calendar-day me-2"></i>اليوم</label>
                    <select name="day" class="form-select">
                        <option value="">اختر</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold"><i class="fas fa-calendar-alt me-2"></i>التاريخ</label>
                    <input type="text" id="date" name="date" class="form-control" placeholder="اختر تاريخًا">
                </div>

                <div class="col-md-12">
                    <label class="fw-semibold"><i class="fas fa-clock me-2"></i>ساعات العمل</label>
                    <input type="text" id="hours" class="form-control" readonly placeholder="سيتم التحديد تلقائيًا">
                </div>

            </div>

            <button class="btn btn-success mt-4"><i class="fas fa-save me-1"></i> حفظ</button>
            <a href="{% url 'appointments_list' %}" class="btn btn-secondary mt-4"><i class="fas fa-arrow-right me-1"></i> رجوع</a>
        </form>
    </div>
</div>

<!-- ================= SCRIPTS ================= -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
let fp = null;

document.querySelector('[name="main_clinic"]').addEventListener("change", function() {
    fetch(`/clinics/load-sub-clinics/?main_id=${this.value}`)
    .then(r => r.json())
    .then(data => {
        let sub = document.querySelector('[name="sub_clinic"]');
        sub.innerHTML = '<option value="">اختر عيادة فرعية</option>';
        data.forEach(i => {
            sub.innerHTML += `<option value="${i.id}">${i.name}</option>`;
        });
        document.querySelector('[name="doctor"]').innerHTML = '<option value="">اختر طبيب</option>';
    });
});

document.querySelector('[name="sub_clinic"]').addEventListener("change", function() {
    fetch(`/clinics/load-doctors/?sub_id=${this.value}`)
    .then(r => r.json())
    .then(data => {
        let doc = document.querySelector('[name="doctor"]');
        doc.innerHTML = '<option value="">اختر طبيب</option>';
        data.forEach(d => {
            doc.innerHTML += `<option value="${d.id}">${d.name}</option>`;
        });
    });
});

document.querySelector('[name="doctor"]').addEventListener("change", function() {
    let doctorId = this.value;

    fetch(`/clinics/load-days/?doctor_id=${doctorId}`)
    .then(r => r.json())
    .then(data => {
        let day = document.querySelector('[name="day"]');
        day.innerHTML = '<option value="">اختر</option>';
        data.forEach(d => {
            day.innerHTML += `<option value="${d}">${d}</option>`;
        });
    });

    fetch(`/clinics/load-hours/?doctor_id=${doctorId}`)
    .then(r => r.json())
    .then(data => {
        document.querySelector('#hours').value = data.start + " - " + data.end;
    });

    fetch(`/clinics/doctor-available-days/?doctor_id=${doctorId}`)
    .then(res => res.json())
    .then(data => {
        if (fp) fp.destroy();
        fp = flatpickr("#date", {
            dateFormat: "Y-m-d",
            enable: data.available_dates
        });
    });
});
</script>

{% endblock %}
