{% extends 'clinics/base.html' %}
{% block title %}تسجيل مستخدم جديد{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-modern p-4">
                <div class="text-center mb-4">
                    <div class="icon-box bg-primary bg-opacity-10 d-inline-block p-3 rounded-4 mb-3">
                        <i class="fas fa-user-plus fa-3x text-primary"></i>
                    </div>
                    <h3 class="fw-bold">📝 إنشاء حساب جديد</h3>
                    <p class="text-muted">أدخل بياناتك للتسجيل في النظام</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>اسم المستخدم</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-envelope me-2"></i>البريد الإلكتروني</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>كلمة المرور</label>
                        {{ form.password1 }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-check-circle me-2"></i>تأكيد كلمة المرور</label>
                        {{ form.password2 }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                        <i class="fas fa-user-check me-2"></i>تسجيل
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="link-custom">لديك حساب بالفعل؟ سجل الدخول</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
