{% extends 'clinics/base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card card-modern p-4 mx-auto" style="max-width:700px;">
        <h4 class="fw-bold mb-3"><i class="fas fa-edit text-warning me-2"></i> ✏️ تعديل الدكتور: {{ doctor.name }}</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>اسم الطبيب</label>{{ form.name }}</div>
            <div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-clinic-medical me-2"></i>العيادة الفرعية</label>{{ form.sub_clinic }}</div>
            <div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-calendar-alt me-2"></i>أيام العمل</label>{{ form.working_days }}</div>
            <div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-clock me-2"></i>ساعات العمل</label>{{ form.working_hours }}</div>
            <button class="btn btn-success"><i class="fas fa-save me-1"></i> حفظ التعديلات</button>
            <a href="{% url 'doctor_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-right me-1"></i> رجوع</a>
        </form>
    </div>
</div>
{% endblock %}
