{% extends 'clinics/base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card card-modern p-4 mx-auto" style="max-width:600px;">
    <h4 class="fw-bold text-info"><i class="fas fa-edit me-2"></i> تعديل عيادة فرعية</h4>
    <form method="post" class="mt-3">
      {% csrf_token %}
      <div class="mb-3"><label class="fw-semibold">العيادة الرئيسية</label>{{ form.main_clinic }}</div>
      <div class="mb-3"><label class="fw-semibold">اسم العيادة الفرعية</label>{{ form.name }}</div>
      <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> حفظ التعديلات</button>
      <a href="{% url 'clinics_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-right me-1"></i> رجوع</a>
    </form>
  </div>
</div>
{% endblock %}
